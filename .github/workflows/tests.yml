name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-protobuf-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        protobuf-version: ["6.31.1", "latest"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified ref
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified ref
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and tests
        run: python -m pip install '.[test]'
      - name: Exercise security-floor dependency
        if: matrix.protobuf-version == '6.31.1'
        run: python -m pip install 'protobuf==6.31.1'
      - name: Verify installed requirements
        run: python -m pip check
      - name: Run standalone contract tests
        run: python -m pytest -q --cov=dot_operator --cov-branch --cov-report=term-missing --cov-fail-under=80
      - name: Build distribution
        run: python -m pip wheel --no-deps --wheel-dir dist .
